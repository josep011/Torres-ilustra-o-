<!DOCTYPE html>
<html lang="pt-BR" data-palette="cobalto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Portfólio de ilustração.">
<title>Josep Oliveira · Ilustração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: aurora granulada fixa ao fundo; cartão de perfil + manifesto,
   serviços com ícones de vidro, grade de trabalhos e contato. Tudo editável. */
:root{
  --bg:#EDEFF6; --surface:#FFFFFF; --ink:#0E1220; --muted:#6A7082;
  --accent:#1238FF; --accent-soft:#AFC0FF; --line:rgba(14,18,32,.09);
  --cream:#FBF7EC; --avatar:#14246A;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-xl:30px; --r-lg:22px; --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
html[data-palette="floresta"]{--bg:#E9F0EB;--ink:#0C1A13;--muted:#627168;--accent:#0B7A50;--accent-soft:#B6E0C6;--avatar:#0F3D2C}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45;overflow-x:hidden;transition:background-color .8s var(--ease),color .8s var(--ease)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}

/* Aurora + grão */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.32;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.grain.fixed{position:fixed;z-index:1;opacity:.28}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--bg) 55%,transparent) 70%,var(--bg) 100%)}

.page{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:16px clamp(16px,4vw,32px) 48px}
section{scroll-margin-top:88px}

/* Navegação */
.nav{position:sticky;top:14px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px 6px 6px;border-radius:999px;
  background:color-mix(in srgb,#fff 46%,transparent);border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 8px 30px -12px rgba(14,18,40,.18)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;text-decoration:none;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:var(--cream);display:grid;place-items:center;overflow:hidden}
.mini svg{width:26px;height:26px;color:var(--avatar)}
.mini img,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.nav a.link{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:14px;color:var(--muted);transition:color .3s,background .3s}
.nav a.link:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.nav-right{display:flex;align-items:center;gap:6px}
.nav-edit{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:13.5px}
.nav-edit svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swap{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 6px 4px 10px;border-radius:999px;font-size:13px;color:var(--muted)}
.swap .track{position:relative;width:52px;height:30px;border-radius:999px;border:1.5px solid var(--accent-soft);background:color-mix(in srgb,#fff 55%,transparent);transition:border-color .6s}
.swap .knob{position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:var(--accent);transition:transform .6s var(--ease),background .6s}
html[data-palette="floresta"] .swap .knob{transform:translateX(22px)}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(32px,6vw,72px) 0 40px}
.card-wrap{perspective:1100px;position:relative;z-index:5}
.card{--rx:0deg;--ry:0deg;--gx:50%;--gy:30%;--glare:0;position:relative;background:var(--surface);border-radius:var(--r-xl);padding:16px 16px 14px;transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 60px -28px rgba(10,20,70,.35),0 8px 18px -10px rgba(10,20,70,.18)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--glare);background:radial-gradient(420px circle at var(--gx) var(--gy),rgba(255,255,255,.55),transparent 45%);mix-blend-mode:soft-light;transition:opacity .4s}
.banner{position:relative;height:124px;border-radius:var(--r-lg);overflow:hidden;background:var(--accent)}
.banner canvas,.banner img{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner img{object-fit:cover;z-index:0}
.banner.has-img .grain{opacity:.15}
.status{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;font-size:12px;color:#fff;background:rgba(6,14,60,.22);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.status i{width:7px;height:7px;border-radius:50%;background:#7CFFB2;animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(124,255,178,.7)}70%,100%{box-shadow:0 0 0 7px rgba(124,255,178,0)}}
.avatar{position:relative;width:86px;height:86px;margin:-46px 0 0 10px;border-radius:50%;background:var(--cream);border:4px solid var(--surface);display:grid;place-items:center;overflow:hidden;transform:translateZ(30px)}
.avatar svg{width:70px;height:70px;margin-top:14px;color:var(--avatar);transition:color .8s}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 2px 14px}
.who h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.15;overflow-wrap:anywhere}
.who p{margin:2px 0 0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-top:1px solid var(--line);padding:16px 0 14px;margin:0}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.stat dd{margin:0;display:flex;align-items:center;gap:8px;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat dd svg{width:18px;height:18px;fill:var(--ink);flex-shrink:0}
.stat dt{font-size:12.5px;color:var(--muted);order:2;text-align:center}
.cta{position:relative;display:flex;align-items:center;width:100%;height:58px;padding:0 8px;border:0;border-radius:999px;overflow:hidden;color:#fff;font-size:16px;background:linear-gradient(90deg,#0A0C12 0%,#0A0C12 45%,#3c3f47 78%,#8a8d94 100%);transform:translateZ(20px)}
.cta .arrow{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-shrink:0;transition:transform .5s var(--ease)}
.cta .arrow svg{width:20px;height:20px;stroke:#0A0C12;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cta span.t{flex:1;text-align:center;padding-right:42px;transition:letter-spacing .5s var(--ease)}
.cta::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s var(--ease)}
.cta:hover::before{transform:translateX(120%)}
.cta:hover .arrow{transform:translateX(6px) rotate(-8deg)}
.cta:hover span.t{letter-spacing:.02em}
/* Deslizar para ativar */
.cta{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.cta .arrow{position:relative;z-index:2;cursor:grab;touch-action:none}
.cta .fill{position:absolute;left:8px;top:8px;bottom:8px;width:42px;border-radius:999px;z-index:1;background:rgba(255,255,255,.16);pointer-events:none;transition:width .5s var(--ease)}
.cta.light .fill{background:rgba(10,12,18,.08)}
.cta span.t{position:relative;z-index:1;transition:letter-spacing .5s var(--ease),opacity .3s}
.cta.dragging .arrow{cursor:grabbing;transition:none}
.cta.dragging .fill{transition:none}
.cta.dragging::before{transform:translateX(-120%)}
.cta.done .arrow{transition:transform .35s var(--ease)}
.cta .arrow.nudge{animation:nudge 3.2s var(--ease) 1.2s infinite}
@keyframes nudge{0%,70%,100%{transform:translateX(0)}78%{transform:translateX(10px)}86%{transform:translateX(0)}92%{transform:translateX(5px)}}
.cta:hover .arrow.nudge,.cta.dragging .arrow.nudge{animation:none}

.manifesto{position:relative;z-index:5}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.manifesto h2{font-size:clamp(30px,4.6vw,54px);line-height:1.02;letter-spacing:-.035em;font-weight:500;text-transform:uppercase;color:var(--accent);margin:0 0 18px;text-wrap:balance;overflow-wrap:anywhere;transition:color .8s}
.manifesto p.lead{max-width:44ch;color:var(--muted);font-size:16.5px;margin:0 0 22px}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{padding:11px 22px;border-radius:999px;font-size:14.5px;background:color-mix(in srgb,#fff 34%,transparent);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 24px -14px rgba(10,20,70,.3);animation:float 7s ease-in-out infinite}
.pill:nth-child(3n+2){animation-delay:-2.3s}.pill:nth-child(3n){animation-delay:-4.6s}
@keyframes float{50%{transform:translateY(-5px)}}

/* Ícones de vidro */
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.section-head h3{font-size:clamp(22px,2.6vw,30px);font-weight:500;letter-spacing:-.025em;margin:0;text-wrap:balance}
.services,.works{position:relative;z-index:5;padding:32px 0}
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.svc{background:color-mix(in srgb,#fff 62%,transparent);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-lg);padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .5s var(--ease),box-shadow .5s}
.svc:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(10,20,70,.35)}
.svc h4{margin:14px 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.svc p{margin:0;font-size:14px;color:var(--muted)}
.gi{position:relative;display:block;width:64px;height:64px}
.gi .s{position:absolute;background:var(--accent);transition:background .8s,transform .6s var(--ease)}
.gi .g{position:absolute;background:color-mix(in srgb,var(--accent-soft) 72%,transparent);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;font-weight:600;transition:background .8s,transform .6s var(--ease)}
.svc:hover .gi .s{transform:translate(3px,-3px)}
.gi.book .s{left:22px;top:6px;width:38px;height:30px;border-radius:7px}
.gi.book .g{left:4px;top:16px;width:46px;height:42px;border-radius:9px}
.gi.book .g::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:3px;border-radius:2px;background:#fff;opacity:.9}
.gi.face .s{right:2px;top:2px;width:28px;height:28px;border-radius:50%}
.gi.face .g{left:4px;top:16px;width:46px;height:40px;border-radius:10px}
.gi.face .g::before{content:"";position:absolute;left:12px;top:13px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:17px 0 0 #fff}
.gi.face .g::after{content:"";position:absolute;left:15px;bottom:11px;width:16px;height:3px;border-radius:2px;background:#fff}
.gi.toggle .s{right:2px;top:12px;width:34px;height:34px;border-radius:50%}
.gi.toggle .g{left:2px;top:17px;width:50px;height:28px;border-radius:999px;background:color-mix(in srgb,var(--accent-soft) 55%,transparent);border:2px solid var(--accent-soft)}
.gi.toggle .g::before{content:"";position:absolute;left:4px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.gi.cal .s{width:5px;height:14px;border-radius:3px;top:6px}
.gi.cal .s.a{left:20px}.gi.cal .s.b{left:38px}
.gi.cal .g{left:8px;top:12px;width:46px;height:44px;border-radius:10px;font-size:19px;padding-top:4px}

/* Trabalhos */
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:5px;border-radius:999px;background:color-mix(in srgb,#fff 50%,transparent);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.filters:empty{display:none}
.filters button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:13.5px;color:var(--muted);transition:background .35s,color .35s}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.work{position:relative;border:0;padding:0;background:none;text-align:left;border-radius:var(--r-lg);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.work.hide{display:none}
.work.fade{opacity:0;transform:scale(.97)}
.cover{--c1:#1238FF;--c2:#fff;--c3:#0a1a8f;position:relative;aspect-ratio:3/4;border-radius:var(--r-lg);overflow:hidden;isolation:isolate;
  background:radial-gradient(60% 50% at 30% 22%,var(--c2),transparent 70%),radial-gradient(70% 60% at 80% 78%,var(--c3),transparent 70%),var(--c1);
  background-size:140% 140%;background-position:0% 0%;transition:background-position 1.4s var(--ease),transform .6s var(--ease),box-shadow .6s;box-shadow:0 18px 40px -26px rgba(10,20,70,.5)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform 1.2s var(--ease)}
.cover .blob{position:absolute;left:28%;top:24%;width:46%;height:52%;border-radius:48% 52% 40% 60%;background:var(--c3);filter:blur(18px);opacity:.85;z-index:0;transition:transform 1.4s var(--ease)}
.cover.has-img .blob{display:none}
.cover.has-img::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;z-index:1;background:linear-gradient(transparent,rgba(5,8,25,.55))}
.cover .grain{z-index:1;opacity:.4}
.cover.has-img .grain{opacity:.18}
.cover .meta{position:absolute;inset:auto 12px 12px 12px;z-index:2;display:flex;flex-direction:column;gap:2px;color:#fff}
.cover .meta b{font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.01em;line-height:1.1;text-shadow:0 1px 12px rgba(0,0,0,.18)}
.cover .meta small{font-family:var(--mono);font-size:11px;opacity:.85}
.cover .tag{position:absolute;top:12px;left:12px;z-index:2;padding:5px 11px;border-radius:999px;font-size:11.5px;color:#fff;background:rgba(6,14,60,.2);border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.work:hover .cover{background-position:100% 100%;transform:translateY(-4px);box-shadow:0 28px 50px -26px rgba(10,20,70,.55)}
.work:hover .blob{transform:translate(8%,-6%) scale(1.08)}
.work:hover .cover img{transform:scale(1.04)}
.empty{grid-column:1/-1;padding:40px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--accent-soft);border-radius:var(--r-lg)}

/* Contato */
.contact{position:relative;z-index:5;margin:32px 0 0;border-radius:var(--r-xl);overflow:hidden;padding:clamp(28px,5vw,56px);color:#fff;background:var(--accent);transition:background .8s}
.contact canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.contact .grain{z-index:1}
.contact>*:not(canvas):not(.grain){position:relative;z-index:2}
.contact h3{font-size:clamp(28px,4vw,46px);font-weight:500;text-transform:uppercase;letter-spacing:-.03em;line-height:1.02;margin:0 0 12px;max-width:16ch;text-wrap:balance}
.contact p{margin:0 0 22px;max-width:46ch;opacity:.9}
.contact .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta.light{width:auto;min-width:280px;background:#fff;color:#0A0C12}
.cta.light .arrow{background:#0A0C12}.cta.light .arrow svg{stroke:#fff}
.ghost{display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.7);color:#fff;text-decoration:none;font-size:14.5px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .3s}
.ghost:hover{background:rgba(255,255,255,.22)}
footer{position:relative;z-index:5;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:22px 2px 0}

/* Diálogos */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:min(92vw,560px);width:100%}
dialog::backdrop{background:rgba(8,12,30,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
dialog[open]{animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.sheet{background:color-mix(in srgb,#fff 88%,transparent);border:1px solid rgba(255,255,255,.9);border-radius:var(--r-xl);padding:22px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 40px 80px -30px rgba(8,12,40,.5)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;flex-shrink:0}
.mailbox{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.mailbox code{flex:1;font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere;user-select:all}
.mailbox button{height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:13.5px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.links a{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;text-decoration:none;font-size:14px}
.links a:hover{border-color:var(--accent);color:var(--accent)}
#viewer{max-width:min(94vw,860px)}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.viewer .cover{box-shadow:none}
.viewer .desc p{color:var(--muted);margin:8px 0 18px;white-space:pre-line}
.nav-row{display:flex;gap:8px}
.nav-row button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.nav-row svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Botão e painel de edição */
.edit-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:8px;height:48px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:14.5px;box-shadow:0 14px 30px -12px rgba(8,12,40,.5);transition:transform .3s var(--ease)}
.edit-fab:hover{transform:translateY(-2px)}
.edit-fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#editor{max-width:min(96vw,620px);height:min(92vh,900px);margin-right:max(2vw,12px)}
#editor .sheet{height:100%;display:flex;flex-direction:column;padding:0;overflow:hidden;background:color-mix(in srgb,#F6F7FB 94%,transparent)}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.ed-head h3{margin:0;font-size:19px;font-weight:600}
.ed-body{flex:1;overflow:auto;padding:6px 20px 20px;overscroll-behavior:contain}
.ed-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:rgba(255,255,255,.7)}
.ed-foot .spacer{flex:1}
fieldset{border:0;margin:0;padding:18px 0 4px;border-bottom:1px solid var(--line)}
fieldset:last-child{border-bottom:0}
legend{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:10px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.f label{font-size:13px;font-weight:500}
.f small{font-size:12px;color:var(--muted)}
.f input[type=text],.f input[type=email],.f input[type=url],.f textarea,.f select{width:100%;font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1px solid rgba(14,18,32,.14);border-radius:12px;padding:10px 12px;transition:border-color .2s,box-shadow .2s}
.f textarea{resize:vertical;min-height:76px;line-height:1.4}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 12px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid rgba(14,18,32,.14);background:#fff;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.small{height:34px;padding:0 12px;font-size:13px}
.btn.icon{width:34px;padding:0}
.btn.danger{color:#B42318}
.btn:disabled{opacity:.45;cursor:not-allowed}
.photo-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.photo-row .avatar{margin:0;width:72px;height:72px;border-width:0;transform:none;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
.photo-row .avatar svg{width:58px;height:58px;margin-top:12px}
.item{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);margin-bottom:10px}
.item .cover{aspect-ratio:3/4;border-radius:12px;box-shadow:none}
.item .cover .meta,.item .cover .tag{display:none}
.item-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tones{display:flex;gap:6px;flex-wrap:wrap}
.tones button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.tones button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.linkrow{display:grid;grid-template-columns:1fr 1.6fr auto;gap:8px;align-items:end;margin-bottom:8px}
.linkrow .f{margin:0}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px}

.toast{position:fixed;left:50%;bottom:22px;z-index:60;transform:translate(-50%,30px);opacity:0;padding:12px 20px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;transition:transform .5s var(--ease),opacity .5s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;justify-items:center}
  .card-wrap{width:100%;max-width:400px}
  .manifesto{width:100%}
  .svc-grid{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .viewer{grid-template-columns:1fr}
  .viewer .cover{height:50vh;width:auto;margin:0 auto}
}
@media (max-width:560px){
  .nav ul{display:none}
  .swap .lbl{display:none}
  .svc{padding:14px}
  .grid,.svc-grid{gap:10px}
  .cover .meta b{font-size:13px}
  .stat dd{font-size:22px}
  .cta.light{min-width:0;width:100%}
  .g3{grid-template-columns:1fr 1fr}
  .linkrow{grid-template-columns:1fr auto}
  .linkrow .f:nth-child(2){grid-column:1/-1;grid-row:2}
  #editor{margin:auto;height:94vh}
  .edit-fab{right:12px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

<body>

<div class="grain fixed" aria-hidden="true"></div>

</dialog>

<button class="edit-fab" id="editFab" type="button" hidden>

</button>

"contactTitle":"Tem um livro esperando capa?","contactText":"Conta a história, o público e o prazo. Eu respondo em até dois dias úteis com uma proposta.","email":"contato@exemplo.com","links":[{"label":"Instagram","url":"https://www.instagram.com/"},{"label":"Behance","url":"https://www.behance.net/"}],"footer":"Ilustração · Brasil"}/*END-DATA*/;

/* ---------- utilidades ---------- */

const TONES = {

const str = (v, max = 300) => (typeof v === "string" ? v : "").slice(0, max);

const imgSrc = ref => (!ref ? "" : ref.startsWith("asset:") ? "/_blob/" + encodeURIComponent(ref.slice(6)) : ref);

let data = sanitize(DEFAULTS);

/* ---------- avatar ---------- */
function fillAvatar(box, ref, alt) {

/* ---------- render ---------- */
function animateNumber(node, raw) {
  const m = /^(\d+(?:[.,]\d+)?)(.*)$/.exec(raw.trim());

  bi.closest(".banner").classList.toggle("has-img", !!d.banner); fillAvatar($("#miniAvatar"), d.avatar, "");

/* ---------- Aurora (canvas em baixa resolução = desfoque leve e natural) ---------- */
const PALETTES = {
  cobalto:  { base: "#E9EDFB", colors: ["#1238FF", "#FFFFFF", "#3C63FF", "#0A1EB0", "#A9BCFF", "#FFFFFF"] },
  floresta: { base: "#DDEBE2", colors: ["#0B7A50", "#E4DC8F", "#2FAE6A", "#06543A", "#9ED9B2", "#0E8F7A"] }
};
const BANNER = {
  cobalto:  { base: "#1238FF", colors: ["#0A1EB0", "#DCE4FF", "#2F55FF", "#03105F", "#6F8DFF"] },
  floresta: { base: "#0B7A50", colors: ["#05402B", "#E4DC8F", "#3CC07A", "#0E6B78", "#7FD39C"] }

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
class Aurora {
  constructor(canvas, pal, { scale = 0.1, sizeMin = 0.35, sizeMax = 0.7, follow = 0.18 } = {}) {
    this.c = canvas; this.ctx = canvas.getContext("2d", { alpha: false });

    this.cur = null; this.setPalette(pal, true);
    this.blobs = this.target.colors.map((_, i) => ({
      x: 0.15 + Math.random() * 0.7, y: 0.15 + Math.random() * 0.7, r: sizeMin + Math.random() * (sizeMax - sizeMin),
      ax: 0.1 + Math.random() * 0.18, ay: 0.08 + Math.random() * 0.16, px: Math.random() * 6.28, py: Math.random() * 6.28,

    new IntersectionObserver(([e]) => { this.visible = e.isIntersecting; }).observe(canvas);
    this.resize();
  }
  setPalette(p, instant) { this.target = { base: hex(p.base), colors: p.colors.map(hex) }; if (instant || !this.cur) this.cur = clone(this.target); }
  point(x, y) { this.tx = x; this.ty = y; }
  resize() { const r = this.c.getBoundingClientRect(); this.c.width = Math.max(8, Math.round(r.width * this.scale)); this.c.height = Math.max(8, Math.round(r.height * this.scale)); this.draw(performance.now(), true); }
  draw(t, force) {
    if (!this.visible && !force) return;
    const { ctx } = this, w = this.c.width, h = this.c.height, m = Math.max(w, h), L = (a, b) => a + (b - a) * 0.035;
    this.cur.base = this.cur.base.map((v, i) => L(v, this.target.base[i]));
    this.cur.colors = this.cur.colors.map((c, j) => c.map((v, i) => L(v, this.target.colors[j][i])));
    this.mx += (this.tx - this.mx) * 0.04; this.my += (this.ty - this.my) * 0.04;

}

let rx = 0, ry = 0, trx = 0, try_ = 0, tilting = false;
function tiltLoop() {
  rx += (trx - rx) * 0.12; ry += (try_ - ry) * 0.12;
  card.style.setProperty("--rx", rx.toFixed(2) + "deg"); card.style.setProperty("--ry", ry.toFixed(2) + "deg");

/* ---------- Deslizar a setinha para ativar (o toque/clique continua funcionando) ---------- */
document.querySelectorAll(".cta").forEach(cta => {
  const knob = cta.querySelector(".arrow"), label = cta.querySelector(".t");
  const fill = el("span", "fill"); fill.setAttribute("aria-hidden", "true"); cta.prepend(fill);
  knob.classList.add("nudge");
  let startX = 0, dx = 0, max = 0, dragging = false, moved = false, suppress = false;
  const paint = () => {
    const p = max ? dx / max : 0;
    knob.style.transform = `translateX(${dx}px) rotate(${p * -8}deg)`;
    fill.style.width = (42 + dx) + "px";
    label.style.opacity = String(Math.max(0, 1 - p * 1.4));
  };
  const reset = () => {
    cta.classList.remove("done"); dx = 0;
    knob.style.transform = ""; fill.style.width = ""; label.style.opacity = "";
  };
  knob.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    max = cta.clientWidth - knob.offsetWidth - 16;
    startX = e.clientX; dx = 0; dragging = true; moved = false;
    knob.classList.remove("nudge");
    try { knob.setPointerCapture(e.pointerId); } catch {}
  });
  knob.addEventListener("pointermove", e => {
    if (!dragging) return;
    const d = Math.max(0, Math.min(max, e.clientX - startX));
    if (!moved && Math.abs(e.clientX - startX) > 4) { moved = true; cta.classList.add("dragging"); }
    if (moved) { dx = d; paint(); }
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; cta.classList.remove("dragging");
    if (!moved) return;
    suppress = true; setTimeout(() => { suppress = false; moved = false; }, 0);
    if (dx >= max * 0.72) {
      cta.classList.add("done"); dx = max; paint();
      if (navigator.vibrate) { try { navigator.vibrate(12); } catch {} }
      setTimeout(() => { openDlg(cta.dataset.open); setTimeout(reset, 400); }, 260);
    } else reset();
  };
  knob.addEventListener("pointerup", end);
  knob.addEventListener("pointercancel", () => { if (dragging) { dragging = false; cta.classList.remove("dragging"); reset(); } });
  /* Depois de arrastar, o soltar não conta como clique (evita abrir duas vezes). */
  cta.addEventListener("click", e => { if (suppress) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
});

/* =========================================================
   ARMAZENAMENTO
   No Claude: dados num banco do artefato e imagens como assets,
   então quem abrir o link vê a versão salva. Fora do Claude
   (arquivo baixado / GitHub Pages): edição local guardada no
   navegador, liberada abrindo o endereço com #editar.
   ========================================================= */
const backend = { mode: "static", canEdit: false, db: null, assets: null, downloads: null, ref: null };

const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open("portfolio", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
};

function showEdit() { backend.canEdit = true; $("#editFab").hidden = false; $("#navEdit").hidden = false; }
async function waitForClaude(ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    if (window.claude && typeof window.claude.use === "function") return window.claude;
    await new Promise(r => setTimeout(r, 100));
  }
  return null;
}
const withTimeout = (p, ms) => Promise.race([Promise.resolve(p).catch(() => null), new Promise(r => setTimeout(() => r(null), ms))]);
async function goLocal(showButton) {
  backend.mode = "local";
  try { const saved = await idb.get("data"); if (saved) { data = sanitize(saved); render(); } } catch {}
  if (showButton) showEdit();
}
async function initBackend() {
  if (DEFAULTS.locked) return; /* cartão do cliente: só visualização, nunca edita */
  const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
  const claude = await waitForClaude(inFrame ? 6000 : 400);
  if (!claude) {
    const wants = () => !data.hideEdit || location.hash === "#editar" || location.protocol === "file:";
    await goLocal(false);
    if (wants()) showEdit();
    addEventListener("hashchange", () => { if (wants() && !backend.canEdit) showEdit(); });
    return;
  }
  const [db, user, assets, downloads] = await Promise.all(["db", "user", "assets", "downloads"].map(n => withTimeout(claude.use(n), 10000)));
  backend.downloads = downloads; backend.assets = assets;
  let allowed = true;
  if (user) {
    const [own, edit] = await Promise.all([withTimeout(user.isOwner(), 4000), withTimeout(user.canEdit(), 4000)]);
    allowed = own === true || edit === true || (own == null && edit == null);
  }
  if (!db) { await goLocal(allowed); return; }
  backend.db = db; backend.mode = "cloud";
  backend.ref = db.doc("site/profile");
  backend.ref.onSnapshot(snap => { if (snap.exists) { data = sanitize(snap.data()); render(); } }, () => {});
  if (allowed) showEdit();
}
initBackend();

/* Reduz a imagem antes de guardar: carrega mais rápido para quem visita. */
function shrink(file, maxSide) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => (b ? resolve(b) : reject(new Error("encode"))), "image/webp", 0.88);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
    im.src = url;
  });
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function pickImage(maxSide) {
  return new Promise(resolve => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/png,image/jpeg,image/webp,image/gif";
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0]; if (!f) return resolve(null);
      if (f.size > 25 * 1024 * 1024) { toast("Imagem muito grande. Use uma de até 25 MB."); return resolve(null); }
      toast("Preparando imagem…", 8000);
      try {
        const small = await shrink(f, maxSide);
        if (backend.mode === "cloud") {
          if (!backend.assets) { toast("Só quem edita a página pode enviar imagens."); return resolve(null); }
          const up = await backend.assets.upload(small); toast("Imagem enviada"); resolve("asset:" + up.id);
        } else { const du = await blobToDataUrl(small); toast("Imagem pronta"); resolve(du); }
      } catch { toast("Não consegui abrir essa imagem. Tente um JPG ou PNG."); resolve(null); }
    }, { once: true });
    inp.click();
  });
}

  body.append(group("Números do cartão", el("p", "hint", "Números do teu currículo. Ex.: anos de experiência, capas, livros publicados, editoras, prêmios."), g3));

  const sv = el("div", "g2");
  d.services.forEach((s, i) => { const c = el("div"); c.append(field("Card " + (i + 1), s.title, v => (s.title = v), { max: 60 }), field("Texto", s.text, v => (s.text = v), { multiline: true, max: 200 })); sv.append(c); });
  body.append(group("Serviços", field("Título da seção", d.servicesTitle, v => (d.servicesTitle = v), { max: 80 }), sv));

  /* Trabalhos */
  const list = el("div");
  d.works.forEach((w, i) => {
    const it = el("div", "item"), cv = el("div", "cover"); cv.append(el("span", "blob"), el("div", "grain")); paintCover(cv, w);
    const right = el("div");
    const tones = el("div", "tones"); tones.setAttribute("role", "group"); tones.setAttribute("aria-label", "Cor de fundo");
    Object.entries(TONES).forEach(([k, t]) => {
      const b = el("button"); b.type = "button"; b.title = t.name; b.setAttribute("aria-label", "Cor " + t.name); b.setAttribute("aria-pressed", String(w.tone === k));
      b.style.background = `linear-gradient(135deg,${t.c[0]},${t.c[2]})`;
      b.addEventListener("click", () => { w.tone = k; dirty = true; buildEditor(); }); tones.append(b);
    });
    const tools = el("div", "item-tools");
    tools.append(
      btn(w.img ? "Trocar arte" : "Enviar arte", "small", async () => { const r = await pickImage(1800); if (r) { w.img = r; dirty = true; buildEditor(); } }),
      ...(w.img ? [btn("Tirar arte", "small", () => { w.img = ""; dirty = true; buildEditor(); })] : []),
      btn("↑", "small icon", () => { if (i > 0) { [d.works[i - 1], d.works[i]] = [d.works[i], d.works[i - 1]]; dirty = true; buildEditor(); } }, "Mover para cima"),
      btn("↓", "small icon", () => { if (i < d.works.length - 1) { [d.works[i + 1], d.works[i]] = [d.works[i], d.works[i + 1]]; dirty = true; buildEditor(); } }, "Mover para baixo"),
      btn("Excluir", "small danger", () => { d.works.splice(i, 1); dirty = true; buildEditor(); })
    );
    const g = el("div", "g2"); g.append(field("Categoria", w.genre, v => (w.genre = v), { max: 30 }), field("Ano", w.year, v => (w.year = v), { max: 12 }));
    right.append(field("Título", w.title, v => (w.title = v), { max: 80 }), g, field("Descrição", w.desc, v => (w.desc = v), { multiline: true, max: 800 }));
    const cvWrap = el("div"); cvWrap.append(cv);
    const bottom = el("div"); bottom.style.gridColumn = "1/-1"; bottom.append(el("p", "hint", w.img ? "Cor usada enquanto a arte carrega:" : "Sem arte: a capa usa este degradê."), tones, tools);
    tools.style.marginTop = "10px";
    it.append(cvWrap, right, bottom); list.append(it);
  });
  const add = btn("+ Adicionar trabalho", "", () => { d.works.unshift({ title: "Novo trabalho", genre: "", year: String(new Date().getFullYear()), tone: "cobalto", img: "", desc: "" }); dirty = true; buildEditor(); });
  add.disabled = d.works.length >= 60;
  body.append(group("Trabalhos", field("Título da seção", d.worksTitle, v => (d.worksTitle = v), { max: 80 }),
    el("p", "hint", "A categoria vira filtro automaticamente quando houver mais de uma."), add, el("div", "", null), list));
  add.style.marginBottom = "12px";

  /* Contato */
  const links = el("div");
  d.links.forEach((l, i) => {
    const r = el("div", "linkrow");
    r.append(field("Nome", l.label, v => (l.label = v), { max: 30 }), field("Endereço", l.url, v => (l.url = v), { type: "url", max: 300 }),
      btn("×", "icon", () => { d.links.splice(i, 1); dirty = true; buildEditor(); }, "Remover link"));
    links.append(r);
  });
  const addL = btn("+ Adicionar link", "small", () => { d.links.push({ label: "", url: "https://" }); dirty = true; buildEditor(); }); addL.disabled = d.links.length >= 8;
  body.append(group("Contato",
    field("Título", d.contactTitle, v => (d.contactTitle = v), { max: 120 }),
    field("Texto", d.contactText, v => (d.contactText = v), { multiline: true, max: 400 }),
    field("E-mail", d.email, v => (d.email = v), { type: "email", max: 120 }),
    links, addL));

  /* Aparência */
  const sel = el("select"), sid = "f" + (++uid); sel.id = sid;
  [["cobalto", "Azul cobalto"], ["floresta", "Verde floresta"]].forEach(([v, t]) => { const o = el("option", "", t); o.value = v; o.selected = d.palette === v; sel.append(o); });
  sel.addEventListener("change", () => { d.palette = sel.value; dirty = true; });
  const fw = el("div", "f"), fl = el("label", "", "Cor inicial do site"); fl.htmlFor = sid; fw.append(fl, sel, el("small", "", "Quem visita ainda pode trocar no botão do topo."));
  const he = el("label", "check"), hcb = el("input"); hcb.type = "checkbox"; hcb.checked = !d.hideEdit;
  hcb.addEventListener("change", () => { d.hideEdit = !hcb.checked; dirty = true; });
  he.append(hcb, document.createTextNode("Mostrar o botão Editar no site do GitHub"));
  body.append(group("Aparência", fw, field("Texto do rodapé", d.footer, v => (d.footer = v), { max: 120 }), he,
    el("p", "hint", "Desmarcado, o botão some para os visitantes. Para editar, abra o endereço com #editar no final.")));
  body.scrollTop = keep;
}

function openEditor() { draft = clone(data); dirty = false; buildEditor(); $("#edBody").scrollTop = 0; ed.showModal(); }
function closeEditor(force) {
  if (!force && dirty && !askDiscard()) return;
  ed.close();
}
let discardArmed = 0;
function askDiscard() {
  if (Date.now() - discardArmed < 3000) return true;
  discardArmed = Date.now(); toast("Você tem mudanças não salvas. Toque de novo para descartar.", 3000); return false;
}
$("#editFab").addEventListener("click", openEditor);
$("#navEdit").addEventListener("click", openEditor);
$("#edClose").addEventListener("click", () => closeEditor());
$("#edCancel").addEventListener("click", () => closeEditor());
ed.addEventListener("cancel", e => { if (dirty && !askDiscard()) e.preventDefault(); });

let saving = false;
$("#edSave").addEventListener("click", async () => {
  if (saving) return;
  const clean = sanitize(draft);
  const badLinks = draft.links.filter(l => (l.label || l.url !== "https://") && (!l.label || !httpUrl(l.url))).length;
  saving = true; $("#edSave").disabled = true; $("#edSave").textContent = "Salvando…";
  try {
    if (backend.mode === "cloud") await backend.ref.set(clean);
    else await idb.set("data", clean);
    data = clean; render(); setPalette(store.get("palette") || data.palette, true);
    dirty = false; ed.close();
    toast(badLinks ? "Salvo. Links sem nome ou com endereço inválido ficaram de fora." : backend.mode === "cloud" ? "Salvo! Quem abrir o link já vê a versão nova." : "Salvo neste navegador. Para publicar no GitHub, use Baixar site (.html).", 3600);
  } catch (e) {
    toast(e && e.code === "quota_exceeded" ? "Espaço cheio. Remova algumas artes e tente de novo." : "Não deu para salvar agora. Tente de novo em instantes.", 4000);
  } finally { saving = false; $("#edSave").disabled = false; $("#edSave").textContent = "Salvar"; }
});

/* Monta o site num arquivo só, com as imagens dentro.
   locked = cartão do cliente: só visualização, sem botão de editar. */
async function buildHtml(src, locked) {
  const out = sanitize(src); out.locked = !!locked; if (locked) out.hideEdit = true;
  const toData = async ref => {
    if (!ref || ref.startsWith("data:")) return ref;
    try { const r = await fetch(imgSrc(ref)); if (!r.ok) return ""; return await blobToDataUrl(await r.blob()); } catch { return ""; }
  };
  out.avatar = await toData(out.avatar); out.banner = await toData(out.banner);
  for (const w of out.works) w.img = await toData(w.img);
  const doc = new DOMParser().parseFromString("<!DOCTYPE html>" + SOURCE_HTML, "text/html");
  doc.querySelectorAll("script:not(#app)").forEach(x => x.remove());
  doc.querySelectorAll("meta[http-equiv]").forEach(m => m.remove());
  const app = doc.getElementById("app"), json = JSON.stringify(out).replace(/</g, "\\u003c");
  const code = app.textContent, i = code.indexOf("/*DATA*/"), j = code.indexOf("/*END-DATA*/");
  app.textContent = code.slice(0, i + 8) + json + code.slice(j);
  doc.title = (out.name || "Portfólio") + " · Portfólio";
  return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
}
async function saveFile(name, html) {
  if (backend.downloads) return backend.downloads.save({ filename: name, data: html });
  const u = URL.createObjectURL(new Blob([html], { type: "text/html" })), l = document.createElement("a");
  l.href = u; l.download = name; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function exportBtn(id, label, file, locked, done) {
  $(id).addEventListener("click", async () => {
    const b = $(id); b.disabled = true; b.textContent = "Gerando…";
    try { await saveFile(file, await buildHtml(draft, locked)); toast(done, 5200); }
    catch (e) { if (!(e && e.code === "declined")) toast("Não consegui gerar o arquivo agora.", 3600); }
    finally { b.disabled = false; b.textContent = label; }
  });
}
exportBtn("#edClient", "Gerar cartão do cliente", "cartao.html", true, "cartao.html pronto. Suba no GitHub e mande o link .../cartao.html para o cliente.");
exportBtn("#edExport", "Baixar minha versão", "index.html", false, "index.html pronto. É a tua versão editável.");
</script>
